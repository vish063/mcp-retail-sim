[project]
name = "mcp-retail-sim"
version = "0.1.0"
description = "An retail mcp for agents to simulate search, product details, add to cart, purchase flows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=4.1.0",
]

[project.scripts]
mcp-retail-sim = "mcp_retail_sim.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
